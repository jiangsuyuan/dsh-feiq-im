<svg xmlns="http://www.w3.org/2000/svg" width="1280" height="780" viewBox="0 0 1280 780" font-family="'Microsoft YaHei','PingFang SC','Noto Sans CJK SC',sans-serif">
  <defs>
    <filter id="sh" x="-25%" y="-25%" width="150%" height="150%">
      <feDropShadow dx="0" dy="4" stdDeviation="8" flood-color="#0f172a" flood-opacity="0.10"/>
    </filter>
    <filter id="sh2" x="-25%" y="-25%" width="150%" height="150%">
      <feDropShadow dx="0" dy="8" stdDeviation="14" flood-color="#0f172a" flood-opacity="0.14"/>
    </filter>
  </defs>

  <rect width="1280" height="780" fill="#f2f4f7"/>
  <text x="24" y="42" font-size="20" font-weight="700" fill="#18202c">局域网 IM 插件（FeiQ 式）· 界面方案</text>
  <text x="24" y="66" font-size="12" fill="#6b7280">常驻右侧气泡 + 未读角标 + 送达 / 已读回执 —— 不占用左侧导航，也不需要添加好友</text>

  <!-- ========== 状态 1：常驻气泡 ========== -->
  <rect x="24" y="88" width="396" height="640" rx="16" fill="#fbfcfe" stroke="#e3e6eb"/>
  <text x="44" y="118" font-size="14" font-weight="700" fill="#18202c">① 常驻气泡（有 3 条未读）</text>
  <text x="44" y="138" font-size="11" fill="#6b7280">挂在工作区右侧边缘，切换面板也不消失</text>

  <!-- 模拟 DSH 窗口 -->
  <rect x="44" y="152" width="356" height="520" rx="12" fill="#ffffff" stroke="#e3e6eb"/>
  <path d="M 56,152 H 140 V 672 H 56 A 12,12 0 0 1 44,660 V 164 A 12,12 0 0 1 56,152 Z" fill="#eef1f5"/>
  <circle cx="66" cy="178" r="4" fill="#c8cfd9"/>
  <rect x="78" y="174" width="42" height="8" rx="4" fill="#d8dee7"/>
  <rect x="52" y="202" width="84" height="24" rx="6" fill="#ffffff" stroke="#dbe1ea"/>
  <circle cx="66" cy="214" r="4" fill="#9aa3af"/>
  <rect x="78" y="210" width="42" height="8" rx="4" fill="#c8cfd9"/>
  <circle cx="66" cy="250" r="4" fill="#d8dee7"/>
  <rect x="78" y="246" width="36" height="8" rx="4" fill="#e3e8ef"/>
  <circle cx="66" cy="282" r="4" fill="#d8dee7"/>
  <rect x="78" y="278" width="46" height="8" rx="4" fill="#e3e8ef"/>

  <!-- 主区域：对话骨架 -->
  <rect x="160" y="176" width="150" height="9" rx="4" fill="#e9edf3"/>
  <rect x="160" y="198" width="206" height="9" rx="4" fill="#eef1f5"/>
  <rect x="160" y="220" width="176" height="9" rx="4" fill="#eef1f5"/>
  <rect x="258" y="278" width="118" height="26" rx="10" fill="#e6ecff"/>
  <rect x="160" y="330" width="190" height="9" rx="4" fill="#eef1f5"/>
  <rect x="160" y="352" width="132" height="9" rx="4" fill="#eef1f5"/>
  <rect x="160" y="560" width="216" height="40" rx="10" fill="#f5f7fa" stroke="#e9edf3"/>
  <circle cx="356" cy="580" r="10" fill="#c9d3f5"/>

  <!-- 气泡 -->
  <circle cx="372" cy="424" r="24" fill="#ffffff" stroke="#dfe4eb" filter="url(#sh2)"/>
  <rect x="359" y="414" width="26" height="18" rx="5" fill="#4d6bfe"/>
  <path d="M 366,432 h 7 l -7,6 z" fill="#4d6bfe"/>
  <circle cx="390" cy="406" r="9.5" fill="#e5484d" stroke="#ffffff" stroke-width="2"/>
  <text x="390" y="410" font-size="10" font-weight="700" fill="#ffffff" text-anchor="middle">3</text>

  <!-- 与 deepseek-meter 并存 -->
  <rect x="266" y="630" width="114" height="24" rx="12" fill="#ffffff" stroke="#e6eaf0"/>
  <text x="323" y="646" font-size="9.5" fill="#6b7280" text-anchor="middle">今日 ¥0.80 · ⚡12k</text>

  <text x="44" y="704" font-size="11" fill="#6b7280">· 位置：右侧垂直居中，避开右下角的用量胶囊</text>
  <text x="44" y="722" font-size="11" fill="#6b7280">· 不注册 main / sidebar.panellist，左侧一条都不加</text>

  <!-- ========== 状态 2：谁发了消息 ========== -->
  <rect x="440" y="88" width="396" height="640" rx="16" fill="#fbfcfe" stroke="#e3e6eb"/>
  <text x="460" y="118" font-size="14" font-weight="700" fill="#18202c">② 点气泡：谁发了消息</text>
  <text x="460" y="138" font-size="11" fill="#6b7280">未读置顶，显示发送人、条数、摘要与时间</text>

  <rect x="464" y="152" width="348" height="520" rx="14" fill="#ffffff" stroke="#e3e6eb" filter="url(#sh)"/>
  <text x="484" y="188" font-size="15" font-weight="700" fill="#18202c">局域网聊天</text>
  <text x="762" y="187" font-size="10.5" fill="#12a150" text-anchor="end">4 人在线</text>
  <text x="788" y="188" font-size="13" fill="#6b7280" text-anchor="middle">⚙</text>
  <line x1="464" y1="204" x2="812" y2="204" stroke="#edf0f4"/>

  <text x="484" y="228" font-size="10" fill="#6b7280" letter-spacing="1">未读 · 3</text>

  <rect x="472" y="236" width="332" height="56" rx="10" fill="#f7f9ff" stroke="#e1e8ff"/>
  <circle cx="496" cy="264" r="16" fill="#ffe0e0"/>
  <text x="496" y="268" font-size="12" font-weight="700" fill="#b42318" text-anchor="middle">王</text>
  <text x="522" y="260" font-size="13" font-weight="600" fill="#18202c">老王</text>
  <text x="522" y="278" font-size="11" fill="#6b7280">文件放哪了？</text>
  <text x="796" y="260" font-size="10" fill="#9aa3af" text-anchor="end">10:24</text>
  <rect x="778" y="270" width="18" height="15" rx="7.5" fill="#e5484d"/>
  <text x="787" y="281" font-size="9.5" font-weight="700" fill="#ffffff" text-anchor="middle">2</text>

  <circle cx="496" cy="318" r="15" fill="#e0f0ff"/>
  <text x="496" y="322" font-size="11" font-weight="700" fill="#1d4ed8" text-anchor="middle">李</text>
  <text x="522" y="314" font-size="13" fill="#18202c">小李</text>
  <text x="522" y="332" font-size="11" fill="#6b7280">在吗</text>
  <text x="796" y="314" font-size="10" fill="#9aa3af" text-anchor="end">10:19</text>
  <rect x="778" y="324" width="18" height="15" rx="7.5" fill="#e5484d"/>
  <text x="787" y="335" font-size="9.5" font-weight="700" fill="#ffffff" text-anchor="middle">1</text>

  <text x="484" y="376" font-size="10" fill="#6b7280" letter-spacing="1">在线同事 · 2</text>

  <circle cx="496" cy="402" r="15" fill="#e8f7ee"/>
  <text x="496" y="406" font-size="11" font-weight="700" fill="#12805c" text-anchor="middle">张</text>
  <text x="522" y="398" font-size="13" fill="#18202c">张工</text>
  <text x="522" y="416" font-size="10.5" fill="#9aa3af">192.168.1.18 · 未聊过</text>
  <circle cx="796" cy="398" r="4" fill="#12a150"/>

  <circle cx="496" cy="446" r="15" fill="#f3e8ff"/>
  <text x="496" y="450" font-size="11" font-weight="700" fill="#7e22ce" text-anchor="middle">A</text>
  <text x="522" y="442" font-size="13" fill="#18202c">阿May</text>
  <text x="522" y="460" font-size="10.5" fill="#9aa3af">192.168.1.31 · 未聊过</text>
  <circle cx="796" cy="442" r="4" fill="#12a150"/>

  <line x1="464" y1="478" x2="812" y2="478" stroke="#edf0f4"/>
  <rect x="480" y="492" width="316" height="64" rx="10" fill="#f7f8fa"/>
  <text x="496" y="516" font-size="11" fill="#6b7280">对方一上线就自动出现在这里，</text>
  <text x="496" y="536" font-size="11" fill="#6b7280">点一下就能说话，不需要添加好友。</text>

  <line x1="480" y1="626" x2="796" y2="626" stroke="#edf0f4"/>
  <text x="484" y="648" font-size="10" fill="#9aa3af">我 · PC-01 · 192.168.1.23</text>
  <text x="792" y="648" font-size="10" fill="#6b7280" text-anchor="end">设置</text>

  <text x="460" y="704" font-size="11" fill="#6b7280">· 角标 = 所有未读之和；点未读会话自动清零</text>
  <text x="460" y="722" font-size="11" fill="#6b7280">· 结束后回列表，未读项立刻消失</text>

  <!-- ========== 状态 3：会话内 ========== -->
  <rect x="856" y="88" width="396" height="640" rx="16" fill="#fbfcfe" stroke="#e3e6eb"/>
  <text x="876" y="118" font-size="14" font-weight="700" fill="#18202c">③ 会话内：送达 / 已读</text>
  <text x="876" y="138" font-size="11" fill="#6b7280">自己发的消息下方直接显示状态，失败可重试</text>

  <rect x="880" y="152" width="348" height="520" rx="14" fill="#ffffff" stroke="#e3e6eb" filter="url(#sh)"/>
  <text x="898" y="190" font-size="18" fill="#6b7280">‹</text>
  <circle cx="934" cy="184" r="15" fill="#ffe0e0"/>
  <text x="934" y="188" font-size="11" font-weight="700" fill="#b42318" text-anchor="middle">王</text>
  <text x="958" y="180" font-size="13" font-weight="600" fill="#18202c">老王</text>
  <text x="958" y="197" font-size="10" fill="#12a150">在线 · PC-07</text>
  <text x="1206" y="180" font-size="10" fill="#4d6bfe" text-anchor="end">已读</text>
  <line x1="880" y1="212" x2="1228" y2="212" stroke="#edf0f4"/>

  <text x="1054" y="236" font-size="9" fill="#9aa3af" text-anchor="middle">今天 10:20</text>
  <rect x="900" y="246" width="196" height="40" rx="12" fill="#f1f3f6"/>
  <text x="914" y="271" font-size="12" fill="#18202c">文件放哪了？</text>

  <rect x="1046" y="302" width="160" height="38" rx="12" fill="#4d6bfe"/>
  <text x="1060" y="326" font-size="12" fill="#ffffff">在 D:\共享 下</text>
  <text x="1206" y="356" font-size="9" fill="#9aa3af" text-anchor="end">✓✓ 已送达 10:21</text>

  <rect x="1090" y="370" width="116" height="38" rx="12" fill="#4d6bfe"/>
  <text x="1104" y="394" font-size="12" fill="#ffffff">我马上发你</text>
  <text x="1206" y="424" font-size="9" fill="#4d6bfe" text-anchor="end">✓✓ 已读 10:22</text>

  <rect x="900" y="440" width="150" height="38" rx="12" fill="#f1f3f6"/>
  <text x="914" y="464" font-size="12" fill="#18202c">好，谢谢</text>

  <rect x="1056" y="494" width="150" height="38" rx="12" fill="#4d6bfe" opacity="0.5"/>
  <text x="1070" y="518" font-size="12" fill="#ffffff">稍等</text>
  <circle cx="1040" cy="513" r="8" fill="#e5484d"/>
  <text x="1040" y="517" font-size="10" font-weight="700" fill="#ffffff" text-anchor="middle">!</text>
  <text x="1206" y="548" font-size="9" fill="#e5484d" text-anchor="end">发送失败 · 点击重试</text>

  <rect x="900" y="606" width="308" height="48" rx="12" fill="#f7f8fa" stroke="#e3e6eb"/>
  <text x="914" y="635" font-size="11" fill="#9aa3af">输入消息，Enter 发送</text>
  <circle cx="1186" cy="630" r="14" fill="#4d6bfe"/>
  <text x="1186" y="634" font-size="10" fill="#ffffff" text-anchor="middle">➤</text>

  <text x="876" y="704" font-size="11" fill="#6b7280">· 单勾 = 对方已收下；双勾 = 对方已读</text>
  <text x="876" y="722" font-size="11" fill="#6b7280">· 顶部「已读 / 未读」汇总最后一条的去向</text>
</svg>
